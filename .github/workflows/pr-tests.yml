name: PR Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Type-check and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check client
        run: npm --workspace client run type-check

      - name: Run tests and enforce coverage
        run: npm run test:coverage

  acceptance-tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    env:
      ACCEPTANCE_BASE_URL: http://127.0.0.1:5173
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080
      VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
      VITE_FIRESTORE_EMULATOR_PORT: 18080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            acceptance-tests/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm ci

      - name: Install acceptance test dependencies
        run: npm ci
        working-directory: acceptance-tests

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: acceptance-tests

      - name: Start Firestore emulator
        run: |
          npx firebase-tools@15.17.0 emulators:start --only firestore --import=./emulator-data > /tmp/firestore-emulator.log 2>&1 &
          echo $! > /tmp/firestore-emulator.pid

          for _ in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/18080) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/firestore-emulator.log
          exit 1

      - name: Seed Firestore emulator
        run: npm run seed:emulator

      - name: Build client app
        run: npm --workspace client run build-only

      - name: Start client app
        run: |
          npm --workspace client run preview -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/client-vite.log 2>&1 &
          echo $! > /tmp/client-vite.pid

          for _ in {1..60}; do
            if curl --silent --fail "$ACCEPTANCE_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/client-vite.log
          exit 1

      - name: Run acceptance tests
        run: npm test
        working-directory: acceptance-tests

      - name: Upload acceptance test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test-report
          path: acceptance-tests/reports/
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: |
          cat /tmp/firestore-emulator.log || true
          cat /tmp/client-vite.log || true
